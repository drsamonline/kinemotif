name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Local references and self-containment
        run: node tools/check-links.mjs

      - name: Inline scripts parse
        run: node tools/check-syntax.mjs

      - name: Manifest is complete
        run: node tools/manifest.mjs --check

      - name: JSON is valid
        run: |
          node -e "for (const f of ['PAGES.json','MANIFEST.json','manifest.webmanifest']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('json ok')"
