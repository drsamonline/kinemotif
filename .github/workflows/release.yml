name: Release

# A tag is the only way a release is published, and the body comes from
# CHANGELOG.md — never from a commit-message guess.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.10.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read the changelog entry
        id: notes
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          node tools/release-notes.mjs "$VERSION" > release-body.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          head -3 release-body.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            --title "Kinemotif ${{ steps.notes.outputs.version }}" \
            --notes-file release-body.md \
            --verify-tag
